<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Petify Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #1f252b;
    color: white;
}

.login-box {
    width: 350px;
    margin: 100px auto;
    padding: 30px;
    background: #2c3136;
    border-radius: 10px;
    box-shadow: 0 0 15px black;
}

input, select {
    background: #3a3f45 !important;
    color: white !important;
    border: none !important;
}

input {
    background: #3a3f45 !important;
    color: #fff !important;
    border: 1px solid #555 !important;
}

    input::placeholder {
    color: #aaa !important;
}
.btn-yellow {
    background: #ffc107;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="login-box">

<h3 class="text-center mb-4">Petify Login</h3>

<select id="role" class="form-control mb-3">
    <option value="user">User</option>
    <option value="admin">Admin</option>
</select>

<input id="username" class="form-control mb-2" placeholder="Username">
<input id="password" type="password" class="form-control mb-3" placeholder="Password">

<button class="btn btn-yellow w-100" onclick="login()">Login</button>

<hr>

<!-- ✅ REGISTER BUTTON -->
<button class="btn btn-light w-100" onclick="goRegister()">New User? Register</button>

</div>

<script>

function login() {

    let role = roleSelect();

    const data = {
        loginName: username.value,
        password: password.value
    };

    if (role === "user") {

        fetch("/api/users/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        })
        .then(res => res.text())
        .then(res => {

            if (res === "Login Successful") {
                localStorage.setItem("user", data.loginName);
                window.location.href = "customer-dashboard.html";
            } else {
                alert("Invalid User");
            }
        });

    } else {

        fetch("/api/admin/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        })
        .then(res => res.text())
        .then(res => {

            if (res === "Admin Login Success") {
                localStorage.setItem("admin", data.loginName);
                window.location.href = "admin-dashboard.html";
            } else {
                alert("Invalid Admin");
            }
        });
    }
}

function roleSelect() {
    return document.getElementById("role").value;
}

function goRegister() {
    window.location.href = "register.html";
}

</script>

</body>
</html>
