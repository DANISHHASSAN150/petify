<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register - Petify</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #1f252b, #111);
    color: white;
    font-family: Arial;
}

.register-box {
    width: 400px;
    margin: 60px auto;
    padding: 30px;
    background: #2c3136;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

input {
    background: #3a3f45 !important;
    color: white !important;
    border: 1px solid #555 !important;
    margin-bottom: 12px;
    border-radius: 8px;
}

input:focus {
    border: 1px solid #ffc107 !important;
    box-shadow: none !important;
}

input::placeholder {
    color: #bbb;
}

.btn-yellow {
    background: #ffc107;
    color: black;
    font-weight: bold;
    border-radius: 8px;
}

.btn-yellow:hover {
    background: #e0a800;
}

a {
    color: #ffc107;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.error {
    color: #ff4d4d;
    font-size: 13px;
}

.password-box {
    position: relative;
}

.eye {
    position: absolute;
    right: 10px;
    top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="register-box">

<h3 class="text-center mb-3">Create Account</h3>

<div class="error" id="error"></div>

<input id="fullname" class="form-control" placeholder="Full Name">
<input id="loginName" class="form-control" placeholder="Username">

<div class="password-box">
    <input id="password" type="password" class="form-control" placeholder="Password">
    <span class="eye" onclick="togglePassword()">👁</span>
</div>

<input id="email" type="email" class="form-control" placeholder="Email">
<input id="address" class="form-control" placeholder="Address">
<input id="gender" class="form-control" placeholder="Gender">
<input id="phone" class="form-control" placeholder="Phone (10 digits)">

<button class="btn btn-yellow w-100 mt-2" onclick="register()">Register</button>

<p class="text-center mt-3">
    Already have account? <a href="login.html">Login</a>
</p>

</div>

<script>

// 👁 Toggle password
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}


// ✅ REGISTER
function register() {

    let errorBox = document.getElementById("error");

    const user = {
        fullname: fullname.value.trim(),
        loginName: loginName.value.trim(),
        password: password.value.trim(),
        email: email.value.trim(),
        address: address.value.trim(),
        gender: gender.value.trim(),
        phone: phone.value.trim()
    };

    // 🔴 VALIDATION
    if (!user.fullname || !user.loginName || !user.password || !user.email) {
        errorBox.innerText = "All fields are required!";
        return;
    }

    if (user.phone.length !== 10 || isNaN(user.phone)) {
        errorBox.innerText = "Phone must be 10 digits!";
        return;
    }

    errorBox.innerText = "";

    // 🔥 API CALL
    fetch("/api/users/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
    })
    .then(res => res.json())
    .then(() => {
        alert("Registered Successfully!");
        window.location.href = "login.html";
    })
    .catch(() => {
        errorBox.innerText = "Registration failed!";
    });
}

</script>

</body>
</html>
