<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #1f252b;
            color: white;
        }

        .card {
            background: #2c3136;
            color: white;
            border: none;
        }

        .btn-yellow {
            background: #ffc107;
            color: black;
        }

        .btn-yellow:hover {
            background: #e0a800;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center">
        <h2>🛒 Your Cart</h2>
        <button class="btn btn-secondary" onclick="goDashboard()">Back</button>
    </div>

    <!-- CART ITEMS -->
    <div id="cartItems" class="mt-4"></div>

    <!-- TOTAL -->
    <h4 class="mt-3">Total: ₹<span id="total">0</span></h4>

    <!-- PLACE ORDER -->
    <button class="btn btn-yellow mt-3" onclick="placeOrder()">Place Order</button>

</div>

<script>

// 🔒 Protect page
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}

// 🔥 LOAD CART
function loadCart() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let html = "";
    let total = 0;

    if (cart.length === 0) {
        html = "<p class='text-warning'>Your cart is empty</p>";
    }

    cart.forEach(item => {

        total += Number(item.price);

        html += `
            <div class="card p-3 mb-2 shadow-sm">
                <h5>${item.type}</h5>
                <p>Price: \u20B9 ${item.price}</p>
            </div>
        `;
    });

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("total").innerText = total;
}

// 🔄 Load on start
window.onload = loadCart;


// 🛒 PLACE ORDER
function placeOrder() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let user = localStorage.getItem("user");

    if (cart.length === 0) {
        alert("Cart is empty!");
        return;
    }

    fetch("/api/orders/place?username=" + user, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(cart)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);

        // clear cart
        localStorage.removeItem("cart");

        // go to orders
        window.location.href = "orders.html";
    });
}


// 🔙 BACK
function goDashboard() {
    window.location.href = "customer-dashboard.html";
}

</script>

</body>
</html>
