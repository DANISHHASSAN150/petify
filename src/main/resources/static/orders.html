<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
body {
    background: #1f252b;
    color: white;
}

/* CARD DARK STYLE */
.card {
    background: #2c3136 !important;
    color: white;
    border-radius: 12px;
}

/* BUTTON */
.btn-secondary {
    background: #444;
    border: none;
}

.btn-secondary:hover {
    background: #666;
}
</style>
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center">📦 My Orders</h2>

    <div class="text-end mb-3">
        <button class="btn btn-secondary" onclick="goDashboard()">Back</button>
    </div>

    <div id="ordersList"></div>

</div>

<script>

// 🔒 Protect page
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}


// 🔥 LOAD ORDERS
function loadOrders() {

    let user = localStorage.getItem("user");

    fetch("/api/orders/my?username=" + user)
    .then(res => res.json())
    .then(data => {

        let html = "";

        if (data.length === 0) {
            html = "<p>No orders found</p>";
        }

        data.forEach(order => {

            html += `
                <div class="card p-3 mb-3 shadow-sm">

                    <p><b>Order ID:</b> ${order.id}</p>
                    <p><b>Total:</b> ₹${order.totalPrice}</p>
                    <p><b>Status:</b> ${order.paymentStatus}</p>
                    <p><b>Date:</b> ${order.orderDate}</p>

                    ${
                        order.paymentStatus === "PENDING"
                        ? `<button onclick="pay(${order.id}, ${order.totalPrice})" class="btn btn-success">
                                Pay Now
                           </button>`
                        : `<span class="text-success">Paid ✔</span>`
                    }

                </div>
            `;
        });

        document.getElementById("ordersList").innerHTML = html;
    });
}


// 🔥 SHOW QR PAYMENT
function pay(id, amount) {

    let upi = "yourname@upi"; // 🔥 CHANGE THIS TO YOUR PHONEPE/UPI ID
    let url = `upi://pay?pa=${upi}&pn=Petify&am=${amount}&cu=INR`;

    let qr = `
        <div class="text-center">
            <h3>Scan & Pay</h3>

           <img src="/img/qr.png" width="200">

            <p class="mt-2">Amount: ₹${amount}</p>

            <button onclick="confirmPayment(${id})" class="btn btn-primary mt-3">
                I Have Paid
            </button>

            <br><br>
            <button onclick="loadOrders()" class="btn btn-secondary">
                Cancel
            </button>
        </div>
    `;

    document.getElementById("ordersList").innerHTML = qr;
}


// 🔥 CONFIRM PAYMENT
function confirmPayment(id) {

    fetch("/api/orders/admin/update/" + id + "?status=PAID", {
        method: "PUT"
    })
    .then(res => res.text())
    .then(msg => {
        alert("Payment Successful!");
        loadOrders();
    });
}


// 🔙 BACK BUTTON
function goDashboard() {
    window.location.href = "customer-dashboard.html";
}


// AUTO LOAD
window.onload = loadOrders;

</script>

</body>
</html>
