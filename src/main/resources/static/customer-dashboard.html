<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
body {
    background: #1f252b;
    color: white;
    margin: 0;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: #000;
    padding: 20px;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 8px;
}

/* BUTTON */
.btn-yellow {
    background: #ffc107;
    color: black;
    font-weight: bold;
}

.btn-yellow:hover {
    background: #e0a800;
}

/* MAIN */
.main {
    padding: 20px;
    width: 100%;
}

/* CARD DESIGN (FIXED SINGLE VERSION) */
.card-dark {
    background: #2c3136;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    transition: 0.3s;
}

.card-dark:hover {
    transform: scale(1.03);
    box-shadow: 0 0 10px #000;
}

/* CHATBOT */
#chatbot {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 300px;
    background: #2c3136;
    border-radius: 10px;
    display: none;
    box-shadow: 0 0 10px black;
}

/* CHAT HEADER */
#chatHeader {
    background: #ffc107;
    padding: 10px;
    color: black;
    font-weight: bold;
}

/* CHAT BODY */
#chatBody {
    height: 200px;
    overflow-y: auto;
    padding: 10px;
}

/* CHAT BUTTON */
#chatBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #ffc107;
    border-radius: 50%;
    padding: 15px;
    cursor: pointer;
    font-size: 20px;
}

/* FAQ */
.faq p {
    cursor: pointer;
    color: #ffc107;
    margin: 5px 0;
}
</style>
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar text-white">
        <h4>Petify</h4>
        <hr>

        <button class="btn btn-light" onclick="showProfile()">Profile</button>
        <button class="btn btn-light" onclick="loadPets()">Browse Pets</button>
        <button class="btn btn-light" onclick="goCart()">Cart</button>
        <button class="btn btn-light" onclick="goOrders()">Orders</button>
        <button class="btn btn-yellow" onclick="logout()">Logout</button>
    </div>

    <!-- MAIN -->
    <div class="main">
        <h2 id="welcome"></h2>
        <div id="content"></div>
    </div>

</div>

<!-- CHAT BUTTON -->
<div id="chatBtn" onclick="toggleChat()">💬</div>

<!-- CHATBOX -->
<div id="chatbot">
    <div id="chatHeader">
    Petify Assistant 🤖
    <span style="float:right; cursor:pointer;" onclick="toggleChat()">✖</span>
</div>

    <div id="chatBody"></div>

    <div class="faq p-2" id="faqList"></div>

    <div class="p-2">
        <input id="chatInput" class="form-control mb-2" placeholder="Ask something...">
        <button class="btn btn-yellow w-100" onclick="sendMsg()">Send</button>
    </div>
</div>

<script>

// 🔒 LOGIN CHECK
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}

let content;

// LOAD PAGE
window.onload = function () {

    content = document.getElementById("content");

    document.getElementById("welcome").innerText =
        "Welcome " + localStorage.getItem("user");

    loadPets();
    loadFAQ();
};
function showProfile() {

    let user = localStorage.getItem("user");

    fetch("/api/users/by-username/" + user)
    .then(res => res.json())
    .then(u => {

        let html = `
            <div class="card-dark">
                <h3>My Profile</h3>
                <p><b>Name:</b> ${u.fullname}</p>
                <p><b>Email:</b> ${u.email}</p>
                <p><b>Address:</b> ${u.address}</p>
                <p><b>Gender:</b> ${u.gender}</p>
                <p><b>Phone:</b> ${u.phone}</p>
            </div>
        `;

        content.innerHTML = html;
    });
}

// ================= PETS =================
function loadPets() {

    fetch("/api/products/all")
    .then(res => res.json())
    .then(data => {

        let contentHTML = "<h3>Available Pets</h3>";

        // 🔥 GROUP BY TYPE
        let grouped = {};

        data.forEach(pet => {
            let type = pet.type.toLowerCase();

            if (!grouped[type]) {
                grouped[type] = [];
            }

            grouped[type].push(pet);
        });

        // 🔥 LOOP EACH CATEGORY
        for (let type in grouped) {

            contentHTML += `
                <h4 class="mt-4 text-warning text-capitalize border-bottom pb-2">
                    ${type}s
                </h4>
                <div class="row">
            `;

            grouped[type].forEach(pet => {

                let img = pet.image;

                if (!img || !img.startsWith("http")) {
                    img = "https://via.placeholder.com/300";
                }

                contentHTML += `
                <div class="col-md-4">
                    <div class="card-dark">

                        <img src="${img}" 
                             style="width:100%; height:200px; object-fit:cover; border-radius:8px;">

                        <h5>${pet.type} - ${pet.breed}</h5>
                        <p>Gender: ${pet.gender}</p>
                        <p>₹${pet.price}</p>

                        <button class="btn btn-primary w-100"
                            onclick="addToCart(${pet.id}, '${pet.type}', ${pet.price})">
                            Add to Cart
                        </button>

                    </div>
                </div>
                `;
            });

            contentHTML += "</div>";
        }

        content.innerHTML = contentHTML;
    });
}

// ================= CART =================
function addToCart(id, type, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({ id, type, price });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Added to Cart!");
}

// ================= NAV =================
function goCart() {
    window.location.href = "cart.html";
}

function goOrders() {
    window.location.href = "orders.html";
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

// ================= CHAT =================
function toggleChat() {

    let chat = document.getElementById("chatbot");

    chat.style.display =
        chat.style.display === "block" ? "none" : "block";
}

// LOAD FAQ
function loadFAQ() {

    let data = JSON.parse(localStorage.getItem("chatbot")) || [];

    let html = "";

    if (data.length === 0) {
        html = "<p>No chatbot data</p>";
    }

    data.forEach(item => {
        html += `<p onclick="ask('${item.q}')">🔹 ${item.q}</p>`;
    });

    document.getElementById("faqList").innerHTML = html;
}

// ASK
function ask(q) {

    let chat = document.getElementById("chatBody");

    chat.innerHTML += `<p><b>You:</b> ${q}</p>`;

    let reply = getReply(q);

    chat.innerHTML += `<p><b>Bot:</b> ${reply}</p>`;
}

// SEND
function sendMsg() {

    let input = document.getElementById("chatInput").value;

    if (!input) return;

    ask(input);

    document.getElementById("chatInput").value = "";
}

// REPLY
function getReply(q) {

    let data = JSON.parse(localStorage.getItem("chatbot")) || [];

    let found = data.find(item =>
        item.q.toLowerCase() === q.toLowerCase()
    );

    return found ? found.a : "I don't understand.";
}

</script>

</body>
</html>
